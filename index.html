<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PokéBot Aventura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #3b82f6;
      --yellow: #facc15;
      --green: #22c55e;
      --red: #ef4444;
      --dark: #0f172a;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: radial-gradient(circle at center, #1e293b 0%, #0b0f19 100%);
      color: #1e293b;
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 960px;
      max-height: 600px;
      background: #38bdf8;
      border-radius: 24px;
      overflow: hidden;
      border: 5px solid #3b82f6;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 0 20px rgba(255,255,255,0.2);
    }
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 10;
    }
    .screen.active {
      display: flex;
    }

    /* TITULO */
    #title-screen {
      background: linear-gradient(180deg, #1e40af 0%, #3b82f6 60%, #60a5fa 100%);
      color: white;
    }
    .title-logo {
      font-family: 'Fredoka One', cursive;
      font-size: 4.2rem;
      color: #facc15;
      text-shadow: 5px 5px 0 #1e3a8a, -2px -2px 0 #1e3a8a, 2px -2px 0 #1e3a8a, -2px 2px 0 #1e3a8a;
      letter-spacing: 2px;
      margin-bottom: 10px;
      animation: float 2.5s infinite ease-in-out alternate;
    }
    .hero-img {
      width: 160px;
      height: 160px;
      object-fit: contain;
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.4));
      margin-bottom: 25px;
      animation: pulseScale 2s infinite ease-in-out alternate;
    }
    .btn-main {
      font-family: 'Fredoka One', cursive;
      font-size: 1.5rem;
      background: linear-gradient(180deg, #34d399 0%, #10b981 100%);
      color: white;
      border: 3px solid #ffffff;
      padding: 12px 42px;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 8px 0 #047857, 0 12px 20px rgba(0,0,0,0.3);
      transition: all 0.1s;
    }
    .btn-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 0 #047857, 0 16px 25px rgba(0,0,0,0.35);
    }
    .btn-main:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #047857;
    }

    /* SELECCIÓN DE PERSONAJE ESTILO CARRUSEL */
    #select-screen {
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      color: white;
      justify-content: space-around;
      padding: 16px 20px;
    }
    .screen-header {
      font-family: 'Fredoka One', cursive;
      font-size: 2.2rem;
      color: #facc15;
      text-shadow: 3px 3px 0 #000;
    }
    
    .carousel-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
      width: 100%;
      max-width: 650px;
    }
    .carousel-arrow {
      width: 65px;
      height: 65px;
      background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
      border: 3px solid #93c5fd;
      border-radius: 50%;
      color: white;
      font-family: 'Fredoka One', cursive;
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 0 #1e3a8a, 0 8px 15px rgba(0,0,0,0.4);
      transition: all 0.1s;
    }
    .carousel-arrow:hover {
      transform: scale(1.08);
      background: #60a5fa;
    }
    .carousel-arrow:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #1e3a8a;
    }

    .carousel-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.06) 100%);
      backdrop-filter: blur(12px);
      border: 4px solid #facc15;
      border-radius: 28px;
      padding: 18px 24px;
      width: 250px;
      height: 290px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 35px rgba(250, 204, 21, 0.4), 0 15px 30px rgba(0,0,0,0.5);
      position: relative;
    }
    .carousel-card img {
      width: 170px;
      height: 170px;
      object-fit: contain;
      filter: drop-shadow(0 12px 18px rgba(0,0,0,0.5));
      animation: float 2.5s infinite ease-in-out alternate;
    }
    .carousel-name {
      font-family: 'Fredoka One', cursive;
      font-size: 1.7rem;
      color: white;
      margin-top: 8px;
      text-shadow: 2px 2px 4px #000;
    }
    .carousel-indicator {
      font-family: 'Fredoka One', cursive;
      font-size: 0.95rem;
      color: #93c5fd;
      background: rgba(15, 23, 42, 0.7);
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid #3b82f6;
    }

    /* PLATAFORMAS */
    #platformer-screen {
      padding: 0;
      background: transparent;
    }
    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #hud {
      position: absolute;
      top: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 5;
    }
    .hud-tag {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 3px solid #facc15;
      padding: 8px 18px;
      border-radius: 30px;
      color: white;
      font-family: 'Fredoka One', cursive;
      font-size: 1.1rem;
      box-shadow: 0 6px 15px rgba(0,0,0,0.4);
    }
    #touch-controls {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 5;
    }
    .ctrl-group {
      display: flex;
      gap: 16px;
      pointer-events: auto;
    }
    .ctrl-btn {
      width: 65px;
      height: 65px;
      background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 100%);
      border: 4px solid #2563eb;
      border-radius: 50%;
      font-size: 1.8rem;
      font-family: 'Fredoka One', cursive;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #1e40af;
      box-shadow: 0 6px 0 #1e40af, 0 10px 15px rgba(0,0,0,0.3);
      transition: all 0.08s;
    }
    .ctrl-btn:active {
      transform: translateY(5px);
      box-shadow: 0 1px 0 #1e40af;
      background: #facc15;
    }

    /* BATALLA ESTADIO */
    #battle-screen {
      background: linear-gradient(180deg, #38bdf8 0%, #60a5fa 40%, #15803d 40%, #166534 100%);
      color: white;
      justify-content: space-between;
      padding: 14px 24px;
      position: relative;
    }
    .arena-top {
      width: 100%;
      height: 52%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      position: relative;
    }
    .battle-stadium-ring {
      position: absolute;
      bottom: 10px;
      width: 85%;
      height: 100px;
      background: rgba(22, 101, 52, 0.9);
      border: 6px solid #facc15;
      border-radius: 50%;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .pokeball-circle {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255,255,255,0.7);
      border-radius: 50%;
    }
    .combatant {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 200px;
      z-index: 2;
    }
    .combatant img {
      width: 130px;
      height: 130px;
      object-fit: contain;
      filter: drop-shadow(0 12px 18px rgba(0,0,0,0.6));
      animation: float 2.5s ease-in-out infinite alternate;
    }
    .hp-box {
      width: 100%;
      background: rgba(15, 23, 42, 0.9);
      border: 3px solid rgba(255,255,255,0.8);
      border-radius: 14px;
      padding: 6px 12px;
      text-align: center;
      margin-top: 6px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.5);
    }
    .hp-bar-bg {
      background: #334155;
      height: 14px;
      border-radius: 7px;
      overflow: hidden;
      margin-top: 4px;
      border: 1px solid #ffffff;
    }
    .hp-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #4ade80, #22c55e);
      width: 100%;
      transition: width 0.4s ease-out, background 0.4s;
    }

    .arena-bottom {
      width: 100%;
      height: 44%;
      background: #ffffff;
      border-radius: 20px;
      border: 5px solid #3b82f6;
      padding: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 2;
    }
    .battle-prompt {
      font-family: 'Fredoka One', cursive;
      font-size: 1.25rem;
      color: #1e3a8a;
      text-align: center;
      margin-bottom: 8px;
    }
    .battle-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      height: 100%;
    }
    .battle-action-btn {
      background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
      border: 3px solid #94a3b8;
      border-radius: 16px;
      font-family: 'Fredoka One', cursive;
      font-size: 1.25rem;
      color: #1e293b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s;
      box-shadow: 0 4px 0 #94a3b8;
    }
    .battle-action-btn:hover {
      background: #dbeafe;
      border-color: #3b82f6;
      box-shadow: 0 4px 0 #2563eb;
      transform: translateY(-2px);
    }
    .battle-action-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #2563eb;
    }

    /* EFECTOS DE BATALLA */
    #battle-effects-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* PREGUNTA ROBÓTICA */
    #question-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 30;
      padding: 16px;
    }
    #question-modal.active {
      display: flex;
    }
    .q-card {
      background: #ffffff;
      border: 6px solid #facc15;
      border-radius: 24px;
      width: 90%;
      max-width: 640px;
      padding: 20px 24px;
      text-align: center;
      box-shadow: 0 0 40px rgba(250, 204, 21, 0.6);
      animation: popIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .q-text {
      font-family: 'Fredoka One', cursive;
      font-size: 1.45rem;
      color: #1e3a8a;
      margin-bottom: 16px;
    }
    .q-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .q-opt {
      background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
      border: 3px solid #cbd5e1;
      border-radius: 16px;
      padding: 14px;
      font-family: 'Fredoka One', cursive;
      font-size: 1.15rem;
      color: #1e293b;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 4px 0 #94a3b8;
    }
    .q-opt:hover {
      background: #dbeafe;
      border-color: #3b82f6;
      box-shadow: 0 4px 0 #2563eb;
      transform: translateY(-2px);
    }
    .q-opt.correct {
      background: linear-gradient(180deg, #bbf7d0 0%, #86efac 100%) !important;
      border-color: #22c55e !important;
      box-shadow: 0 4px 0 #16a34a !important;
      color: #15803d;
    }
    .q-opt.wrong {
      background: linear-gradient(180deg, #fecaca 0%, #fca5a5 100%) !important;
      border-color: #ef4444 !important;
      box-shadow: 0 4px 0 #dc2626 !important;
      color: #991b1b;
    }

    /* VICTORIA */
    #victory-screen {
      background: linear-gradient(180deg, #15803d 0%, #064e3b 100%);
      color: white;
      text-align: center;
      position: relative;
    }
    #confetti-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .badge-icon {
      font-size: 3.5rem;
      margin-bottom: 8px;
      animation: spinBounce 2s infinite ease-in-out;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      100% { transform: translateY(-12px); }
    }
    @keyframes pulseScale {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }
    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes attackShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(30px) scale(1.08); }
      50% { transform: translateX(-20px); }
    }
    @keyframes spinBounce {
      0% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.15) rotate(12deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .screen-shaking {
      animation: screenShake 0.35s ease-out;
    }
    @keyframes screenShake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-8px, 6px); }
      40% { transform: translate(8px, -6px); }
      60% { transform: translate(-5px, 3px); }
      80% { transform: translate(5px, -3px); }
    }
  </style>
</head>
<body>

<div id="game-container">

  <!-- 1. PANTALLA INICIAL -->
  <div id="title-screen" class="screen active">
    <div class="title-logo">POKÉ-BOT</div>
    <img class="hero-img" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" alt="Pikachu" />
    <button class="btn-main" onclick="goToSelectScreen()">JUGAR</button>
  </div>

  <!-- 2. SELECCIÓN DE PERSONAJE CARRUSEL (12 POKÉMON) -->
  <div id="select-screen" class="screen">
    <div class="screen-header">Elige tu Pokémon</div>
    
    <div class="carousel-stage">
      <button class="carousel-arrow" onclick="carouselPrev()">◀</button>
      
      <div class="carousel-card">
        <img id="carousel-img" src="" alt="Pokemon" />
        <div class="carousel-name" id="carousel-name">Pikachu</div>
        <div class="carousel-indicator" id="carousel-indicator">1 / 12</div>
      </div>
      
      <button class="carousel-arrow" onclick="carouselNext()">▶</button>
    </div>

    <div style="display:flex; gap:16px;">
      <button class="btn-main" style="background:#64748b; border-color:#94a3b8; box-shadow:0 6px 0 #475569; font-size:1.1rem; padding:10px 24px;" onclick="showScreen('title-screen')">Volver</button>
      <button class="btn-main" style="font-size:1.25rem; padding:10px 38px;" onclick="startAdventure()">¡Elegir y Jugar! ➔</button>
    </div>
  </div>

  <!-- 3. PLATAFORMAS CANVAS CON CÁMARA SCROLL -->
  <div id="platformer-screen" class="screen">
    <canvas id="gameCanvas" width="960" height="600"></canvas>
    
    <div id="hud">
      <div class="hud-tag" id="hud-name">Pikachu</div>
      <div class="hud-tag">Rivales: <span id="hud-rivals" style="color:#f87171;">0</span> / 6</div>
      <div class="hud-tag">Tuercas: <span id="hud-gears" style="color:#facc15;">0</span> / 8</div>
    </div>

    <div id="touch-controls">
      <div class="ctrl-group">
        <div class="ctrl-btn" onmousedown="setTouch('left', true)" onmouseup="setTouch('left', false)" ontouchstart="setTouch('left', true)" ontouchend="setTouch('left', false)">◀</div>
        <div class="ctrl-btn" onmousedown="setTouch('right', true)" onmouseup="setTouch('right', false)" ontouchstart="setTouch('right', true)" ontouchend="setTouch('right', false)">▶</div>
      </div>
      <div class="ctrl-group">
        <div class="ctrl-btn" onmousedown="setTouch('jump', true)" onmouseup="setTouch('jump', false)" ontouchstart="setTouch('jump', true)" ontouchend="setTouch('jump', false)" style="background: linear-gradient(180deg,#4ade80,#22c55e); color:white; border-color:#15803d; box-shadow:0 6px 0 #15803d;">▲</div>
      </div>
    </div>
  </div>

  <!-- 4. BATALLA -->
  <div id="battle-screen" class="screen">
    <canvas id="battle-effects-canvas" width="960" height="600"></canvas>

    <div class="arena-top">
      <div class="battle-stadium-ring">
        <div class="pokeball-circle"></div>
      </div>

      <div class="combatant">
        <div class="hp-box">
          <div style="font-family:'Fredoka One', cursive; font-size:1.1rem; color:#facc15;" id="b-pname">Pikachu</div>
          <div class="hp-bar-bg"><div class="hp-bar-fill" id="b-php"></div></div>
        </div>
        <img id="b-pimg" src="" alt="Player" />
      </div>

      <div style="font-family:'Fredoka One', cursive; font-size:2.4rem; color:#facc15; text-shadow:3px 3px 0 #000; z-index:2;">VS</div>

      <div class="combatant">
        <div class="hp-box">
          <div style="font-family:'Fredoka One', cursive; font-size:1.1rem; color:#f87171;" id="b-ename">Meowth</div>
          <div class="hp-bar-bg"><div class="hp-bar-fill" id="b-ehp"></div></div>
        </div>
        <img id="b-eimg" src="" alt="Rival" />
      </div>
    </div>

    <div class="arena-bottom">
      <div class="battle-prompt" id="b-msg">¿Qué ataque quieres usar?</div>
      <div class="battle-grid" id="b-moves-grid"></div>
    </div>
  </div>

  <!-- 5. PREGUNTA ROBÓTICA -->
  <div id="question-modal">
    <div class="q-card">
      <div style="font-family:'Fredoka One', cursive; font-size:1rem; color:#3b82f6; margin-bottom:4px; letter-spacing:1px;">RETO DE ROBÓTICA</div>
      <div class="q-text" id="q-title">¿Qué le da energía a un robot?</div>
      <div class="q-grid" id="q-buttons"></div>
    </div>
  </div>

  <!-- 6. PANTALLA GANASTE -->
  <div id="victory-screen" class="screen">
    <canvas id="confetti-canvas" width="960" height="600"></canvas>
    <div class="badge-icon">🏆⚙️⚡</div>
    <div class="title-logo" style="margin-bottom:6px; font-size:3.5rem;">¡MISIÓN CUMPLIDA!</div>
    <div style="font-family:'Fredoka One', cursive; font-size:1.4rem; color:#facc15; margin-bottom:15px;">¡Derrotaste a todos los rivales!</div>
    <img id="victory-img" src="" style="width:140px; height:140px; margin-bottom:20px; object-fit:contain; filter:drop-shadow(0 10px 20px rgba(0,0,0,0.5));" alt="Pokemon" />
    <div style="display:flex; gap:16px; z-index:2;">
      <button class="btn-main" onclick="restartGame()">Jugar Otra Vez</button>
      <button class="btn-main" style="background:#3b82f6; border-color:#60a5fa; box-shadow:0 8px 0 #1d4ed8;" onclick="showScreen('title-screen')">Inicio</button>
    </div>
  </div>

</div>

<script>
/* ==========================================================
   12 POKÉMON DISPONIBLES EN EL CARRUSEL
========================================================== */
const POKEMON_LIST = [
  {
    id: 'pikachu',
    name: 'Pikachu',
    img: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png',
    hp: 100,
    moves: [
      { name: 'Impactrueno', power: 35, heal: 0, fx: 'electric' },
      { name: 'Rayo', power: 50, heal: 0, fx: 'electric' },
      { name: 'Ataque Rápido', power: 30, heal: 0, fx: 'normal' },
      { name: 'Descanso', power: 0, heal: 40, fx: 'heal' }
    ]
  },
  {
    id: 'charmander',
    name: 'Charmander',
    img: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/4.png',
    hp: 100,
    moves: [
      { name: 'Ascuas', power: 35, heal: 0, fx: 'fire' },
      { name: 'Lanzallamas', power: 50, heal: 0, fx: 'fire' },
      { name: 'Arañazo', power: 30, heal: 0, fx: 'normal' },
      { name: 'Descanso', power: 0, heal: 40, fx: 'heal' }
    ]
  },
  {
    id: 'charizard',
    name: 'Charizard',
    img: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png',
    hp: 110,
    moves: [
      { name: 'Lanzallamas', power: 50, heal: 0, fx: 'fire' },

/* ==========================================================
   SONIDO (Web Audio)
========================================================== */
let audioCtx = null;
function playSound(type) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'jump') {
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.exponentialRampToValueAtTime(450, now + 0.12);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
      osc.start(now);
      osc.stop(now + 0.12);
    } else if (type === 'coin') {
      osc.frequency.setValueAtTime(550, now);
      osc.frequency.setValueAtTime(750, now + 0.08);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
      osc.start(now);
      osc.stop(now + 0.2);
    } else if (type === 'good') {
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.setValueAtTime(600, now + 0.1);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
      osc.start(now);
      osc.stop(now + 0.3);
    } else if (type === 'bad') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.setValueAtTime(140, now + 0.15);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (type === 'attack') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.25);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    }
  } catch (e) {}
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) el.classList.add('active');

  if (id === 'platformer-screen') {
    gameRunning = true;
    requestAnimationFrame(gameLoop);
  } else if (id === 'battle-screen') {
    gameRunning = false;
    requestAnimationFrame(battleLoop);
  } else if (id === 'victory-screen') {
    gameRunning = false;
    initConfetti();
    requestAnimationFrame(confettiLoop);
  } else {
    gameRunning = false;
  }
}

window.addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
    if (document.getElementById('select-screen').classList.contains('active')) carouselPrev();
    else keys.left = true;
  }
  if (e.code === 'ArrowRight' || e.code === 'KeyD') {
    if (document.getElementById('select-screen').classList.contains('active')) carouselNext();
    else keys.right = true;
  }
  if ((e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') && player.grounded) {
    player.vy = player.jumpForce;
    player.grounded = false;
    playSound('jump');
    spawnDust(player.x + player.w / 2, player.y + player.h);
  }
});

window.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
});

function setTouch(act, val) {
  if (act === 'left') keys.left = val;
  if (act === 'right') keys.right = val;
  if (act === 'jump' && val && player.grounded) {
    player.vy = player.jumpForce;
    player.grounded = false;
    playSound('jump');
    spawnDust(player.x + player.w / 2, player.y + player.h);
  }
}

function spawnDust(x, y) {
  for (let i = 0; i < 5; i++) {
    platformParticles.push({
      x: x + (Math.random() - 0.5) * 20,
      y: y - 2,
      vx: (Math.random() - 0.5) * 2.5,
      vy: -Math.random() * 2,
      radius: Math.random() * 5 + 3,
      alpha: 0.8,
      color: 'rgba(255, 255, 255, '
    });
  }
}

function spawnSparkles(x, y) {
  for (let i = 0; i < 14; i++) {
    platformParticles.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      radius: Math.random() * 4 + 2,
      alpha: 1,
      color: 'rgba(250, 204, 21, '
    });
  }
}

function gameLoop() {
  if (!gameRunning) return;
  animationTick++;

  // Movimiento horizontal
  if (keys.left) {
    player.vx = -player.speed;
    player.facing = 'left';
    if (player.grounded && Math.random() < 0.25) {
      spawnDust(player.x + player.w * 0.7, player.y + player.h);
    }
  } else if (keys.right) {
    player.vx = player.speed;
    player.facing = 'right';
    if (player.grounded && Math.random() < 0.25) {
      spawnDust(player.x + player.w * 0.3, player.y + player.h);
    }
  } else {
    player.vx *= 0.82;
  }

  // Gravedad
  player.vy += 0.65;
  if (player.vy > 12) player.vy = 12;

  player.x += player.vx;
  player.y += player.vy;

  // Límites del mundo extendido
  if (player.x < 0) player.x = 0;
  if (player.x + player.w > WORLD_WIDTH) player.x = WORLD_WIDTH - player.w;

  // Actualizar Cámara (Scroll suave que sigue al Pokémon)
  const targetCamX = player.x - 300;
  cameraX += (targetCamX - cameraX) * 0.1;
  if (cameraX < 0) cameraX = 0;
  if (cameraX > WORLD_WIDTH - 960) cameraX = WORLD_WIDTH - 960;

  // Colisión con plataformas
  player.grounded = false;
  platforms.forEach(p => {
    if (
      player.x + player.w * 0.7 > p.x &&
      player.x + player.w * 0.3 < p.x + p.w &&
      player.y + player.h >= p.y &&
      player.y + player.h <= p.y + 18 &&
      player.vy >= 0
    ) {
      if (!player.grounded && player.vy > 4) {
        spawnDust(player.x + player.w / 2, p.y);
      }
      player.y = p.y - player.h;
      player.vy = 0;
      player.grounded = true;
    }
  });

  // Recolección de tuercas
  gears.forEach(g => {
    if (!g.taken) {
      const d = Math.hypot((player.x + player.w/2) - g.x, (player.y + player.h/2) - g.y);
      if (d < 40) {
        g.taken = true;
        gearsFound++;
        playSound('coin');
        spawnSparkles(g.x, g.y);
        document.getElementById('hud-gears').textContent = gearsFound;
      }
    }
  });

  // Tocar rivales para combatir
  rivals.forEach(r => {
    if (!r.defeated) {
      if (
        player.x + player.w * 0.8 > r.x &&
        player.x + player.w * 0.2 < r.x + r.w &&
        player.y + player.h > r.y &&
        player.y < r.y + r.h
      ) {
        startBattle(r);
      }
    }
  });

  // Victoria al vencer a los 6 rivales y recoger las 8 tuercas
  if (rivals.every(r => r.defeated) && gearsFound >= TOTAL_GEARS) {
    gameRunning = false;
    setTimeout(() => {
      document.getElementById('victory-img').src = selectedPoke.img;
      showScreen('victory-screen');
      playSound('good');
    }, 300);
  }

  // Renderizar gráficos con cámara
  renderCanvasWorld();

  requestAnimationFrame(gameLoop);
}

/* ==========================================================
   RENDERIZADO CON CÁMARA Y PROFUNDIDAD (PARALLAX)
========================================================== */
function renderCanvasWorld() {
  if (!canvas) {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
  }

  // 1. Cielo Degradado
  const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
  skyGradient.addColorStop(0, '#38bdf8');
  skyGradient.addColorStop(0.6, '#7dd3fc');
  skyGradient.addColorStop(1, '#bae6fd');
  ctx.fillStyle = skyGradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 2. Sol (Parallax muy lento)
  const sunX = 850 - cameraX * 0.05;
  const sunY = 70;
  const sunGlow = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 65);
  sunGlow.addColorStop(0, 'rgba(254, 240, 138, 1)');
  sunGlow.addColorStop(0.4, 'rgba(250, 204, 21, 0.7)');
  sunGlow.addColorStop(1, 'rgba(250, 204, 21, 0)');
  ctx.fillStyle = sunGlow;
  ctx.beginPath();
  ctx.arc(sunX, sunY, 65, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#fef08a';
  ctx.beginPath();
  ctx.arc(sunX, sunY, 32, 0, Math.PI * 2);
  ctx.fill();

  // 3. Montañas de Fondo con Parallax
  drawParallaxMountains();

  // 4. Nubes con Parallax
  drawCloud(180 - cameraX * 0.15, 85, 1.1);
  drawCloud(540 - cameraX * 0.15, 110, 0.9);
  drawCloud(950 - cameraX * 0.15, 75, 1.2);
  drawCloud(1400 - cameraX * 0.15, 120, 0.85);
  drawCloud(1850 - cameraX * 0.15, 90, 1.05);
  drawCloud(2300 - cameraX * 0.15, 105, 1.0);
  drawCloud(2850 - cameraX * 0.15, 80, 1.15);
  drawCloud(3300 - cameraX * 0.15, 115, 0.95);

  // --- TRASLACIÓN DE LA CÁMARA PARA EL MUNDO ---
  ctx.save();
  ctx.translate(-cameraX, 0);

  // 5. Plataformas
  platforms.forEach(p => {
    drawStylizedPlatform(p);
  });

  // 6. Tuercas Doradas
  gears.forEach(g => {
    if (!g.taken) {
      drawGoldenGear(g.x, g.y, animationTick);
    }
  });

  // 7. Rivales
  rivals.forEach(r => {
    if (!r.defeated) {
      drawRival(r);
    }
  });

  // 8. Jugador Pokémon (Orientación corregida hacia adelante)
  drawPlayer();

  // 9. Partículas del mundo
  renderPlatformParticles();

  ctx.restore();
}

function drawParallaxMountains() {
  ctx.save();
  // Capa lejana
  ctx.fillStyle = '#93c5fd';
  ctx.beginPath();
  ctx.moveTo(0, 520);
  for (let x = -200; x < 4000; x += 300) {
    const peakX = x - cameraX * 0.2;
    ctx.lineTo(peakX, 350 + (x % 40));
    ctx.lineTo(peakX + 150, 520);
  }
  ctx.lineTo(canvas.width, 520);
  ctx.fill();

  // Capa cercana
  ctx.fillStyle = '#86efac';
  ctx.beginPath();
  ctx.moveTo(0, 520);
  for (let x = -200; x < 4000; x += 400) {
    const hillX = x - cameraX * 0.4;
    ctx.quadraticCurveTo(hillX + 200, 420, hillX + 400, 520);
  }
  ctx.fill();
  ctx.restore();
}

function drawCloud(x, y, scale) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  
  ctx.fillStyle = 'rgba(203, 213, 225, 0.4)';
  ctx.beginPath();
  ctx.arc(0, 6, 26, 0, Math.PI * 2);
  ctx.arc(28, 6, 34, 0, Math.PI * 2);
  ctx.arc(58, 6, 26, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
  ctx.beginPath();
  ctx.arc(0, 0, 26, 0, Math.PI * 2);
  ctx.arc(28, -6, 34, 0, Math.PI * 2);
  ctx.arc(58, 0, 26, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawStylizedPlatform(p) {
  ctx.save();
  const radius = p.isGround ? 0 : 12;

  // Cuerpo
  const dirtGrad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
  dirtGrad.addColorStop(0, '#92400e');
  dirtGrad.addColorStop(1, '#451a03');
  ctx.fillStyle = dirtGrad;
  
  ctx.beginPath();
  ctx.roundRect(p.x, p.y, p.w, p.h, [radius, radius, radius, radius]);
  ctx.fill();

  // Capa Superior de Césped
  const grassHeight = p.isGround ? 16 : 10;
  const grassGrad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + grassHeight);
  grassGrad.addColorStop(0, '#4ade80');
  grassGrad.addColorStop(1, '#16a34a');
  ctx.fillStyle = grassGrad;

  ctx.beginPath();
  ctx.roundRect(p.x, p.y, p.w, grassHeight, [radius, radius, 0, 0]);
  ctx.fill();

  // Borde iluminado
  ctx.strokeStyle = '#86efac';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(p.x + radius, p.y + 1);
  ctx.lineTo(p.x + p.w - radius, p.y + 1);
  ctx.stroke();

  // Flores decorativas
  if (!p.isGround) {
    drawFlower(p.x + 20, p.y - 4, '#f43f5e');
    drawFlower(p.x + p.w - 25, p.y - 4, '#38bdf8');
  }

  // Sombra inferior
  if (!p.isGround) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
    ctx.beginPath();
    ctx.ellipse(p.x + p.w/2, p.y + p.h + 20, p.w * 0.45, 8, 0, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.restore();
}

function drawFlower(x, y, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x - 3, y - 3, 3, 0, Math.PI * 2);
  ctx.arc(x + 3, y - 3, 3, 0, Math.PI * 2);
  ctx.arc(x, y - 6, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fef08a';
  ctx.beginPath();
  ctx.arc(x, y - 3, 2, 0, Math.PI * 2);
  ctx.fill();
}

function drawGoldenGear(x, y, tick) {
  ctx.save();
  const floatY = y + Math.sin(tick * 0.08) * 4;
  
  ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
  ctx.beginPath();
  ctx.ellipse(x, y + 25, 14, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.translate(x, floatY);
  ctx.rotate(tick * 0.04);

  ctx.fillStyle = '#ca8a04';
  for (let i = 0; i < 6; i++) {
    ctx.rotate(Math.PI / 3);
    ctx.fillRect(-17, -5, 34, 10);
  }

  const gearGrad = ctx.createRadialGradient(0, -4, 2, 0, 0, 16);
  gearGrad.addColorStop(0, '#fef08a');
  gearGrad.addColorStop(0.5, '#eab308');
  gearGrad.addColorStop(1, '#a16207');
  ctx.fillStyle = gearGrad;
  ctx.beginPath();
  ctx.arc(0, 0, 14, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#38bdf8';
  ctx.beginPath();
  ctx.arc(0, 0, 5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawRival(r) {
  ctx.save();
  const floatY = Math.sin(animationTick * 0.06 + r.x) * 4;
  const currY = r.y + floatY;

  ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
  ctx.beginPath();
  ctx.ellipse(r.x + r.w/2, r.y + r.h - 2, r.w * 0.35, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  const imgObj = loadedImages[r.img];
  if (imgObj && imgObj.complete) {
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(imgObj, r.x, currY, r.w, r.h);
  }

  ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
  ctx.beginPath();
  ctx.roundRect(r.x + r.w/2 - 38, currY - 26, 76, 20, 10);
  ctx.fill();
  ctx.strokeStyle = '#f87171';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 12px Fredoka One, Nunito';
  ctx.textAlign = 'center';
  ctx.fillText(r.name, r.x + r.w/2, currY - 12);

  ctx.restore();
}

function drawPlayer() {
  ctx.save();
  
  ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
  ctx.beginPath();
  ctx.ellipse(player.x + player.w/2, player.y + player.h - 2, player.w * 0.35, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  const bobbing = (Math.abs(player.vx) > 0.5 && player.grounded) ? Math.sin(animationTick * 0.3) * 3 : 0;

  const pImg = loadedImages[selectedPoke.img];
  if (pImg && pImg.complete) {
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    // Orientación correcta al avanzar
    if (player.facing === 'right') {
      ctx.translate(player.x + player.w, player.y + bobbing);
      ctx.scale(-1, 1);
      ctx.drawImage(pImg, 0, 0, player.w, player.h);
    } else {
      ctx.drawImage(pImg, player.x, player.y + bobbing, player.w, player.h);
    }
  }
  ctx.restore();
}

function renderPlatformParticles() {
  for (let i = platformParticles.length - 1; i >= 0; i--) {
    const p = platformParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.alpha -= 0.03;

    if (p.alpha <= 0) {
      platformParticles.splice(i, 1);
      continue;
    }

    ctx.fillStyle = `${p.color}${p.alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ==========================================================
   SISTEMA DE COMBATE CON PARTÍCULAS Y PODERES
========================================================== */
function startBattle(rival) {
  gameRunning = false;
  activeRival = rival;
  playerHp = selectedPoke.hp;
  rivalHp = rival.hp;
  battleParticles = [];
  floatingTexts = [];

  document.getElementById('b-pname').textContent = selectedPoke.name;
  document.getElementById('b-pimg').src = selectedPoke.img;
  document.getElementById('b-ename').textContent = rival.name;
  document.getElementById('b-eimg').src = rival.img;

  updateHpUI();
  renderBattleButtons();
  document.getElementById('b-msg').textContent = '¿Qué ataque quieres usar?';

  showScreen('battle-screen');
}

function battleLoop() {
  if (document.getElementById('battle-screen').classList.contains('active')) {
    renderBattleEffects();
    requestAnimationFrame(battleLoop);
  }
}

function renderBattleEffects() {
  if (!fxCanvas) {
    fxCanvas = document.getElementById('battle-effects-canvas');
    fxCtx = fxCanvas.getContext('2d');
  }

  fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);

  for (let i = battleParticles.length - 1; i >= 0; i--) {
    const p = battleParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;

    if (p.life <= 0) {
      battleParticles.splice(i, 1);
      continue;
    }

    fxCtx.save();
    fxCtx.globalAlpha = p.life / p.maxLife;

    if (p.type === 'electric') {
      fxCtx.strokeStyle = '#fde047';
      fxCtx.lineWidth = p.size;
      fxCtx.beginPath();
      fxCtx.moveTo(p.x, p.y);
      fxCtx.lineTo(p.x + (Math.random() - 0.5) * 30, p.y + (Math.random() - 0.5) * 30);
      fxCtx.stroke();
    } else if (p.type === 'fire') {
      fxCtx.fillStyle = p.life % 2 === 0 ? '#ea580c' : '#facc15';
      fxCtx.beginPath();
      fxCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      fxCtx.fill();
    } else if (p.type === 'water') {
      fxCtx.fillStyle = 'rgba(96, 165, 250, 0.8)';
      fxCtx.beginPath();
      fxCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      fxCtx.fill();
      fxCtx.strokeStyle = '#ffffff';
      fxCtx.lineWidth = 1.5;
      fxCtx.stroke();
    } else if (p.type === 'leaf') {
      fxCtx.fillStyle = '#22c55e';
      fxCtx.beginPath();
      fxCtx.ellipse(p.x, p.y, p.size, p.size / 2, p.life * 0.2, 0, Math.PI * 2);
      fxCtx.fill();
    } else if (p.type === 'heal') {
      fxCtx.fillStyle = '#4ade80';
      fxCtx.font = '22px sans-serif';
      fxCtx.fillText('💚', p.x, p.y);
    } else {
      fxCtx.fillStyle = '#ffffff';
      fxCtx.beginPath();
      fxCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      fxCtx.fill();
    }

    fxCtx.restore();
  }

  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y += ft.vy;
    ft.alpha -= 0.02;

    if (ft.alpha <= 0) {
      floatingTexts.splice(i, 1);
      continue;
    }

    fxCtx.save();
    fxCtx.globalAlpha = ft.alpha;
    fxCtx.font = 'bold 32px Fredoka One, Nunito';
    fxCtx.textAlign = 'center';
    fxCtx.fillStyle = ft.color;
    fxCtx.strokeStyle = '#000000';
    fxCtx.lineWidth = 4;
    fxCtx.strokeText(ft.text, ft.x, ft.y);
    fxCtx.fillText(ft.text, ft.x, ft.y);
    fxCtx.restore();
  }
}

function triggerMoveFX(fxType, isPlayer) {
  const startX = isPlayer ? 240 : 720;
  const startY = 170;
  const targetX = isPlayer ? 720 : 240;
  const targetY = 170;

  const count = fxType === 'heal' ? 12 : 30;

  for (let i = 0; i < count; i++) {
    const angle = Math.atan2(targetY - startY, targetX - startX) + (Math.random() - 0.5) * 0.6;
    const speed = fxType === 'heal' ? Math.random() * 2 : Math.random() * 9 + 6;

    battleParticles.push({
      x: fxType === 'heal' ? startX + (Math.random() - 0.5) * 60 : startX,
      y: fxType === 'heal' ? startY + (Math.random() - 0.5) * 60 : startY,
      vx: fxType === 'heal' ? (Math.random() - 0.5) * 2 : Math.cos(angle) * speed,
      vy: fxType === 'heal' ? -Math.random() * 3 - 1 : Math.sin(angle) * speed,
      type: fxType,
      size: Math.random() * 8 + 4,
      life: 30,
      maxLife: 30
    });
  }
}

function triggerScreenShake() {
  const container = document.getElementById('game-container');
  container.classList.add('screen-shaking');
  setTimeout(() => container.classList.remove('screen-shaking'), 350);
}

function spawnFloatingText(text, x, y, color) {
  floatingTexts.push({
    text: text,
    x: x,
    y: y,
    vy: -2,
    alpha: 1,
    color: color
  });
}

function updateHpUI() {
  const pPct = Math.max(0, (playerHp / selectedPoke.hp) * 100);
  const rPct = Math.max(0, (rivalHp / activeRival.maxHp) * 100);

  const pBar = document.getElementById('b-php');
  const rBar = document.getElementById('b-ehp');

  pBar.style.width = pPct + '%';
  rBar.style.width = rPct + '%';

  pBar.style.background = pPct < 35 ? 'linear-gradient(90deg, #f87171, #ef4444)' : 'linear-gradient(90deg, #4ade80, #22c55e)';
  rBar.style.background = rPct < 35 ? 'linear-gradient(90deg, #f87171, #ef4444)' : 'linear-gradient(90deg, #4ade80, #22c55e)';
}

function renderBattleButtons() {
  const container = document.getElementById('b-moves-grid');
  container.innerHTML = '';

  selectedPoke.moves.forEach(move => {
    const btn = document.createElement('button');
    btn.className = 'battle-action-btn';
    btn.textContent = move.name;
    btn.onclick = () => openQuestion(move);
    container.appendChild(btn);
  });
}

function openQuestion(move) {
  currentChosenMove = move;
  const modal = document.getElementById('question-modal');
  const randQ = QUESTIONS[Math.floor(Math.random() * QUESTIONS.length)];

  document.getElementById('q-title').textContent = randQ.q;
  const btnBox = document.getElementById('q-buttons');
  btnBox.innerHTML = '';

  randQ.opts.forEach((optText, i) => {
    const btn = document.createElement('button');
    btn.className = 'q-opt';
    btn.textContent = optText;
    btn.onclick = () => submitAnswer(i, randQ.correct, btn);
    btnBox.appendChild(btn);
  });

  modal.classList.add('active');
}

function submitAnswer(chosen, correct, btn) {
  const isOk = (chosen === correct);
  const all = document.querySelectorAll('.q-opt');
  all.forEach(b => b.disabled = true);

  if (isOk) {
    btn.classList.add('correct');
    playSound('good');
  } else {
    btn.classList.add('wrong');
    all[correct].classList.add('correct');
    playSound('bad');
  }

  setTimeout(() => {
    document.getElementById('question-modal').classList.remove('active');
    runTurn(isOk);
  }, 1000);
}

function runTurn(success) {
  const playerSprite = document.getElementById('b-pimg');

  if (success) {
    document.getElementById('b-msg').textContent = `¡Correcto! ¡${selectedPoke.name} usó ${currentChosenMove.name}!`;
    playSound('attack');
    playerSprite.style.animation = 'attackShake 0.4s ease';

    triggerMoveFX(currentChosenMove.fx || 'normal', true);

    setTimeout(() => {
      triggerScreenShake();
      if (currentChosenMove.power > 0) {
        rivalHp -= currentChosenMove.power;
        if (rivalHp < 0) rivalHp = 0;
        spawnFloatingText(`-${currentChosenMove.power} HP`, 720, 130, '#f87171');
      }
      if (currentChosenMove.heal > 0) {
        playerHp += currentChosenMove.heal;
        if (playerHp > selectedPoke.hp) playerHp = selectedPoke.hp;
        spawnFloatingText(`+${currentChosenMove.heal} HP`, 240, 130, '#4ade80');
      }
      updateHpUI();
    }, 250);

    setTimeout(() => {
      playerSprite.style.animation = 'float 2.5s ease-in-out infinite alternate';

      if (rivalHp <= 0) {
        document.getElementById('b-msg').textContent = `¡Ganaste el combate!`;
        activeRival.defeated = true;
        updateRivalsHUD();
        setTimeout(() => {
          player.x += (player.facing === 'right' ? 80 : -80);
          showScreen('platformer-screen');
        }, 1200);
      } else {
        enemyTurn();
      }
    }, 900);

  } else {
    document.getElementById('b-msg').textContent = '¡Casi! Turno del rival...';
    setTimeout(enemyTurn, 800);
  }
}

function enemyTurn() {
  const enemySprite = document.getElementById('b-eimg');
  document.getElementById('b-msg').textContent = `¡${activeRival.name} ataca!`;
  enemySprite.style.animation = 'attackShake 0.4s ease';
  playSound('attack');

  triggerMoveFX('normal', false);

  setTimeout(() => {
    triggerScreenShake();
    playerHp -= 15;
    if (playerHp < 15) playerHp = 15;
    spawnFloatingText(`-15 HP`, 240, 130, '#f87171');
    updateHpUI();
  }, 250);

  setTimeout(() => {
    enemySprite.style.animation = 'float 2.5s ease-in-out infinite alternate';
    document.getElementById('b-msg').textContent = '¿Qué ataque quieres usar?';
  }, 900);
}

/* ==========================================================
   CONFETI DE VICTORIA
========================================================== */
function initConfetti() {
  confettiPieces = [];
  const colors = ['#facc15', '#38bdf8', '#4ade80', '#f43f5e', '#a855f7', '#fb923c'];
  for (let i = 0; i < 90; i++) {
    confettiPieces.push({
      x: Math.random() * 960,
      y: Math.random() * -600,
      w: Math.random() * 12 + 6,
      h: Math.random() * 8 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      vy: Math.random() * 3 + 2,
      vx: (Math.random() - 0.5) * 2,
      angle: Math.random() * 360,
      vAngle: (Math.random() - 0.5) * 6
    });
  }
}

function confettiLoop() {
  if (!document.getElementById('victory-screen').classList.contains('active')) return;

  if (!confCanvas) {
    confCanvas = document.getElementById('confetti-canvas');
    confCtx = confCanvas.getContext('2d');
  }

  confCtx.clearRect(0, 0, confCanvas.width, confCanvas.height);

  confettiPieces.forEach(c => {
    c.y += c.vy;
    c.x += c.vx;
    c.angle += c.vAngle;

    if (c.y > 600) {
      c.y = -20;
      c.x = Math.random() * 960;
    }

    confCtx.save();
    confCtx.translate(c.x, c.y);
    confCtx.rotate((c.angle * Math.PI) / 180);
    confCtx.fillStyle = c.color;
    confCtx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
    confCtx.restore();
  });

  requestAnimationFrame(confettiLoop);
}

// Iniciar al cargar
window.onload = () => {
  preloadAllImages();
  goToSelectScreen();
};
